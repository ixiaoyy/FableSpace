services:
  backend:
    environment:
      FABLESPACE_SCHEMA_REVISION_MARKER_PATH: /schema-revision/revision
    networks:
      - default
      - shared_services
    volumes:
      - /opt/fablespace-schema:/schema-revision:ro

  memory-worker:
    environment:
      FABLESPACE_SCHEMA_REVISION_MARKER_PATH: /schema-revision/revision
    networks:
      - default
      - shared_services
    volumes:
      - /opt/fablespace-schema:/schema-revision:ro

networks:
  default:
  shared_services:
    external: true
    name: ${FABLESPACE_SHARED_NETWORK:-parallellines_default}
