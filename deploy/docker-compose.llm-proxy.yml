services:
  backend:
    depends_on:
      llm-proxy:
        condition: service_started
    environment:
      FABLESPACE_LLM_PROXY_URL: http://llm-proxy:7890
    networks:
      - llm_egress

  llm-proxy:
    image: docker.io/metacubex/mihomo:v1.19.29@sha256:e1d7dadaa9368a52d420d65007e0e0d87cb148d292faa67326eda3fef5757f59
    command: ["-d", "/root/.config/mihomo"]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${FABLESPACE_LLM_PROXY_CONFIG_DIR:-/opt/fablespace-secrets/llm-proxy}:/root/.config/mihomo
    expose:
      - "7890"
    networks:
      - llm_egress
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  llm_egress:
