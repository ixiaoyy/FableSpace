services:
  frontend:
    depends_on:
      - keycloak
      - mirror-game

  mirror-identity-db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    env_file:
      - path: ./apps/mirror-island/.env.production
        required: true
    volumes:
      - mirror_identity_db:/var/lib/postgresql/data
    mem_limit: 512m
    shm_size: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mirror-game-db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    env_file:
      - path: ./apps/mirror-island/.env.production
        required: true
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export POSTGRES_DB="$${MIRROR_GAME_POSTGRES_DB}"
        export POSTGRES_USER="$${MIRROR_GAME_POSTGRES_USER}"
        export POSTGRES_PASSWORD="$${MIRROR_GAME_POSTGRES_PASSWORD}"
        exec docker-entrypoint.sh postgres
    volumes:
      - mirror_game_db:/var/lib/postgresql/data
    mem_limit: 384m
    shm_size: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$MIRROR_GAME_POSTGRES_USER\" -d \"$$MIRROR_GAME_POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1@sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
    command: ["start", "--import-realm"]
    env_file:
      - path: ./apps/mirror-island/.env.production
        required: true
    environment:
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx640m
    depends_on:
      mirror-identity-db:
        condition: service_healthy
    volumes:
      - ./apps/mirror-island/keycloak/mirror-island-realm.json:/opt/keycloak/data/import/mirror-island-realm.json:ro
      - ./apps/mirror-island/keycloak/themes/mirror-island:/opt/keycloak/themes/mirror-island:ro
    expose:
      - "8080"
      - "9000"
    mem_limit: 768m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mirror-game:
    build:
      context: .
      dockerfile: apps/mirror-island/Dockerfile.server
    image: mirror-island-game:local
    env_file:
      - path: ./apps/mirror-island/.env.production
        required: true
    depends_on:
      keycloak:
        condition: service_started
      mirror-game-db:
        condition: service_healthy
    expose:
      - "3001"
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mirror-game-migrate:
    build:
      context: .
      dockerfile: apps/mirror-island/Dockerfile.migrate
    image: mirror-island-migrate:local
    env_file:
      - path: ./apps/mirror-island/.env.production
        required: true
    depends_on:
      mirror-game-db:
        condition: service_healthy
    profiles: ["migration"]
    restart: "no"

volumes:
  mirror_identity_db:
  mirror_game_db:
