<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>镜像岛 · RPGJS 联机尖峰</title>
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no, minimum-scale=1, width=device-width, height=device-height"
    />
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/reset.css">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/index.css">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/theme-default/theme.css">
    <style>
      body, #rpg {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      .authFailure {
        box-sizing: border-box;
        display: grid;
        gap: 12px;
        margin: 20vh auto 0;
        max-width: 420px;
        padding: 28px;
        text-align: center;
      }
      .authFailure h1,
      .authFailure p {
        margin: 0;
      }
      .authFailure__retry {
        justify-self: center;
        min-height: 40px;
        padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <div id="rpg"></div>
  </body>
</html>
