server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /game-media/v1/ {
        proxy_pass https://img.pingxingxian.space/game/media/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host img.pingxingxian.space;
        proxy_ssl_server_name on;
        proxy_ssl_name img.pingxingxian.space;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
