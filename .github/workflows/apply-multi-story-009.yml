name: Apply FableSpace 009 atomic switch

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY-009-MULTI-STORY-FABLESPACE-PRODUCTION
        required: true
        type: string

concurrency:
  group: fablespace-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Back up, verify, and apply 009
    runs-on: ubuntu-latest
    environment: production-schema-009
    steps:
      - uses: actions/checkout@v4

      - name: Validate explicit production confirmation and pinned assets
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ "${CONFIRMATION}" != "APPLY-009-MULTI-STORY-FABLESPACE-PRODUCTION" ]; then
            echo "::error::Confirmation did not match the required 009 production phrase"
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::009 can only be dispatched from main"
            exit 1
          fi
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done
          py_compile_command="import py_compile; py_compile.compile('deploy/server/migration_009_contract.py', doraise=True); py_compile.compile('deploy/server/migration_009_tool.py', doraise=True)"
          python -c "${py_compile_command}"
          bash -n deploy/server/apply_multi_story_009.sh
          python deploy/server/migration_009_tool.py validate-assets --repository-root .

          expected_migration_sha="7cba47e90f6b1fcdbb9ee55913acab1b1490796f374f197ee3c78adc63201ea1"
          expected_contract_sha="b8b536c6ba003db84d85bf0bbc121df534997e65c3c50d26a664e28e119ae345"
          expected_tool_sha="8cc4cd4ca49ee5f7a75871a67807e855c9e215034a151b4fe925ed808032c72f"
          expected_apply_script_sha="1bb85c07a3205b6a688f967d7585dd543c1aa802fe191d1c272b2d0ab7f17e94"
          expected_marker_sha="3bbc627cd746d6cb919998aabdd063d4c894ceaf4f6fdd81c0093ddbfda74bea"
          expected_approval_sha="ede40dcdf52df2b18f7e7994138e3df9917028307b21d0ba8d26b91a06a02ca8"
          test "$(sha256sum apps/api/sql/migrations/009_multi_story_atomic_switch.sql | awk '{print $1}')" = "${expected_migration_sha}"
          test "$(sha256sum deploy/server/migration_009_contract.py | awk '{print $1}')" = "${expected_contract_sha}"
          test "$(sha256sum deploy/server/migration_009_tool.py | awk '{print $1}')" = "${expected_tool_sha}"
          test "$(sha256sum deploy/server/apply_multi_story_009.sh | awk '{print $1}')" = "${expected_apply_script_sha}"
          test "$(sha256sum deploy/schema-revision.txt | awk '{print $1}')" = "${expected_marker_sha}"
          test "$(sha256sum deploy/release-approval.txt | awk '{print $1}')" = "${expected_approval_sha}"

      - name: Apply the pinned release on production
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          CDN_BASE_URL: ${{ secrets.CDN_BASE_URL }}
          CDN_S3_PREFIX: ${{ vars.CDN_S3_PREFIX || 'fablespace' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 60m
          envs: VITE_API_BASE,CDN_BASE_URL,CDN_S3_PREFIX
          script: |
            set -eu

            FABLESPACE_PATH="/opt/fablespace"
            EXPECTED_SHA="${{ github.sha }}"
            EXPECTED_REPOSITORY="${{ github.repository }}"
            APPLY_SCRIPT_RELATIVE="deploy/server/apply_multi_story_009.sh"
            EXPECTED_APPLY_SCRIPT_SHA="1bb85c07a3205b6a688f967d7585dd543c1aa802fe191d1c272b2d0ab7f17e94"

            cd "${FABLESPACE_PATH}"
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Production checkout has tracked changes; refusing the atomic switch"
              exit 1
            fi
            git remote set-url origin "https://github.com/${EXPECTED_REPOSITORY}.git"
            git fetch --force --no-tags origin \
              'refs/heads/main:refs/remotes/origin/main'
            if [ "$(git rev-parse --verify "refs/remotes/origin/main^{commit}")" != "${EXPECTED_SHA}" ]; then
              echo "origin/main does not match the workflow commit"
              exit 1
            fi

            APPLY_SCRIPT_TEMP="$(mktemp /tmp/fablespace-apply-009.XXXXXX)"
            if ! git show "${EXPECTED_SHA}:${APPLY_SCRIPT_RELATIVE}" > "${APPLY_SCRIPT_TEMP}"; then
              rm -f -- "${APPLY_SCRIPT_TEMP}"
              echo "Could not export the pinned 009 apply script"
              exit 1
            fi
            chmod 0700 "${APPLY_SCRIPT_TEMP}"
            if [ "$(sha256sum "${APPLY_SCRIPT_TEMP}" | awk '{print $1}')" != "${EXPECTED_APPLY_SCRIPT_SHA}" ]; then
              rm -f -- "${APPLY_SCRIPT_TEMP}"
              echo "Pinned 009 apply script hash mismatch"
              exit 1
            fi

            exec env EXPECTED_SHA="${EXPECTED_SHA}" \
              FABLESPACE_EXPORTED_APPLY_SCRIPT="${APPLY_SCRIPT_TEMP}" \
              /bin/sh "${APPLY_SCRIPT_TEMP}"
