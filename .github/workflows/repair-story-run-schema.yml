name: Repair StoryRun production schema

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY-006-AND-008-FABLESPACE-PRODUCTION
        required: true
        type: string

concurrency:
  group: fablespace-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    name: Back up and repair production schema
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation and deployment secrets
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ "${CONFIRMATION}" != "APPLY-006-AND-008-FABLESPACE-PRODUCTION" ]; then
            echo "::error::Confirmation did not match the required production repair phrase"
            exit 1
          fi
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Repair StoryRun schema on production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -eu

            FABLESPACE_PATH="/opt/fablespace"
            EXPECTED_SHA="${{ github.sha }}"
            DATABASE_NAME="fablespace"
            MIGRATION_006="apps/api/sql/migrations/006_story_run_player_role.sql"
            MIGRATION_008="apps/api/sql/migrations/008_retire_legacy_space_schema.sql"
            MIGRATION_006_SHA256="3d9e155235defd6f83ca3482e40fd1eb1d177f3158c40675f2ae318841c9bd20"
            MIGRATION_008_SHA256="7208327d7d7517252ffb735e7af5b982340ca2b9db38d8f5ee4da81ccaf48c2c"
            ORM_ASSERTION="from fablespace_api.infrastructure.story_state_models import StoryRunModel; column = StoryRunModel.__table__.c.player_role_id; assert str(column.type) == 'VARCHAR(128)' and column.nullable is False; assert 'private_memories' not in StoryRunModel.__table__.c"
            BACKUP_DIR="${FABLESPACE_PATH}/backups/story-run-schema-repair"
            REPAIR_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            BACKUP_TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            BACKUP_PATH="${BACKUP_DIR}/fablespace-before-006-008-${BACKUP_TIMESTAMP}.sql"
            BACKEND_STOPPED=false
            DDL_STARTED=false

            cd "${FABLESPACE_PATH}"

            if [ "$(git rev-parse HEAD)" != "${EXPECTED_SHA}" ]; then
              echo "Server checkout does not match the workflow commit"
              exit 1
            fi
            if [ ! -f "${MIGRATION_006}" ] || [ ! -f "${MIGRATION_008}" ]; then
              echo "Required reviewed migration file is missing"
              exit 1
            fi
            if [ "$(sha256sum "${MIGRATION_006}" | awk '{print $1}')" != "${MIGRATION_006_SHA256}" ] ||
               [ "$(sha256sum "${MIGRATION_008}" | awk '{print $1}')" != "${MIGRATION_008_SHA256}" ]; then
              echo "Reviewed migration file hash does not match the approved repair"
              exit 1
            fi

            if sudo docker compose version >/dev/null 2>&1; then
              # Run Compose with the plugin available on the production host.
              compose() {
                sudo docker compose "$@"
              }
            else
              # Run Compose with the legacy binary available on the production host.
              compose() {
                sudo docker-compose "$@"
              }
            fi

            # Return success only when the backend can serve its local health endpoint.
            backend_is_healthy() {
              compose -f docker-compose.yml -f deploy/docker-compose.shared.yml \
                exec -T backend python -c \
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()" \
                >/dev/null 2>&1
            }

            # Restore writes only when no DDL ran; partial DDL requires manual recovery.
            cleanup() {
              status=$?
              trap - EXIT
              trap - HUP INT TERM
              if [ "${status}" -ne 0 ] && [ "${BACKEND_STOPPED}" = "true" ]; then
                if [ "${DDL_STARTED}" = "false" ]; then
                  echo "Repair stopped before DDL; restarting the verified backend image"
                  BACKEND_RECOVERED=false
                  if compose -f docker-compose.yml -f deploy/docker-compose.shared.yml \
                    up -d --no-deps --no-build --force-recreate backend; then
                    for ATTEMPT in $(seq 1 30); do
                      if backend_is_healthy; then
                        BACKEND_RECOVERED=true
                        break
                      fi
                      sleep 2
                    done
                  fi
                  if [ "${BACKEND_RECOVERED}" = "true" ]; then
                    echo "Verified backend health after the pre-DDL failure"
                  else
                    echo "CRITICAL: backend health could not be restored after the pre-DDL failure"
                  fi
                else
                  echo "Repair failed after DDL began; stopping backend for manual recovery"
                  if ! compose -f docker-compose.yml -f deploy/docker-compose.shared.yml \
                    stop backend >/dev/null 2>&1; then
                    echo "CRITICAL: unable to confirm the backend is stopped after DDL failure"
                  else
                    echo "Backend stopped; preserve the backup for manual recovery"
                  fi
                fi
              fi
              exit "${status}"
            }
            trap cleanup EXIT
            trap 'exit 1' HUP INT TERM

            RUNNING_BACKEND_CONTAINER="$(compose -f docker-compose.yml -f deploy/docker-compose.shared.yml ps -q backend)"
            if [ -z "${RUNNING_BACKEND_CONTAINER}" ] ||
               [ "$(printf '%s\n' "${RUNNING_BACKEND_CONTAINER}" | wc -l)" -ne 1 ] ||
               [ "$(sudo docker inspect -f '{{.State.Running}}' "${RUNNING_BACKEND_CONTAINER}")" != "true" ]; then
              echo "Expected exactly one running FableSpace backend container"
              exit 1
            fi
            if ! backend_is_healthy; then
              echo "Running backend is not healthy before maintenance"
              exit 1
            fi
            compose -f docker-compose.yml -f deploy/docker-compose.shared.yml \
              exec -T backend python -c "${ORM_ASSERTION}"

            echo "Building the backend image from the verified checkout"
            compose -f docker-compose.yml -f deploy/docker-compose.shared.yml build backend
            sudo docker run --rm --entrypoint python fablespace-backend:local -c \
              "${ORM_ASSERTION}"

            if [ ! -d /opt/parallellines ]; then
              echo "ParallelLines deployment directory is missing"
              exit 1
            fi
            DB_CONTAINER="$(cd /opt/parallellines && compose ps -q db)"
            if [ -z "${DB_CONTAINER}" ] || [ "$(printf '%s\n' "${DB_CONTAINER}" | wc -l)" -ne 1 ]; then
              echo "Expected exactly one ParallelLines database container"
              exit 1
            fi
            if [ "$(sudo docker inspect -f '{{.State.Running}}' "${DB_CONTAINER}")" != "true" ]; then
              echo "ParallelLines database container is not running"
              exit 1
            fi

            # Execute fixed read-only SQL and return only the requested scalar or names.
            db_query() {
              printf '%s\n' "$1" | sudo docker exec -i "${DB_CONTAINER}" sh -c \
                'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; exec mysql -uroot --database=fablespace --batch --skip-column-names --raw'
            }

            echo "Stopping backend writes before the production backup"
            compose -f docker-compose.yml -f deploy/docker-compose.shared.yml stop backend
            BACKEND_STOPPED=true

            if [ -L "${FABLESPACE_PATH}/backups" ] || [ -L "${BACKUP_DIR}" ]; then
              echo "Backup directory must not be a symbolic link"
              exit 1
            fi
            mkdir -p "${BACKUP_DIR}"
            chmod 0700 "${BACKUP_DIR}"
            case "${BACKUP_PATH}" in
              "${BACKUP_DIR}"/fablespace-before-006-008-*.sql)
                ;;
              *)
                echo "Resolved backup path escaped the protected backup directory"
                exit 1
                ;;
            esac

            echo "Creating a complete logical backup of ${DATABASE_NAME}"
            if ! sudo docker exec "${DB_CONTAINER}" sh -c \
              'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; exec mysqldump -uroot --single-transaction --routines --triggers --events --databases fablespace' \
              > "${BACKUP_PATH}"; then
              rm -f -- "${BACKUP_PATH}"
              echo "Logical backup failed before DDL"
              exit 1
            fi
            chmod 0600 "${BACKUP_PATH}"
            if [ ! -s "${BACKUP_PATH}" ]; then
              rm -f -- "${BACKUP_PATH}"
              echo "Logical backup is empty"
              exit 1
            fi
            BACKUP_SHA_LINE="$(sha256sum "${BACKUP_PATH}")"
            printf '%s\n' "${BACKUP_SHA_LINE}" > "${BACKUP_PATH}.sha256"
            chmod 0600 "${BACKUP_PATH}.sha256"
            echo "Backup ready: ${BACKUP_PATH}"
            echo "Backup SHA-256: ${BACKUP_SHA_LINE%% *}"

            SCHEMA_COUNT="$(db_query "SELECT COUNT(*) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME = '${DATABASE_NAME}';")"
            REQUIRED_TABLE_COUNT="$(db_query "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = '${DATABASE_NAME}' AND TABLE_TYPE = 'BASE TABLE' AND TABLE_NAME IN ('player_story_states','story_runs','character_relationships','story_events','story_messages','private_memories','managed_story_worlds','managed_media_assets');")"
            UNREVIEWED_TABLE_COUNT="$(db_query "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = '${DATABASE_NAME}' AND TABLE_TYPE = 'BASE TABLE' AND TABLE_NAME NOT IN ('player_story_states','story_runs','character_relationships','story_events','story_messages','private_memories','managed_story_worlds','managed_media_assets','characters','world_info','visitors','chat_messages','memory_atoms','gameplay_sessions','llm_configs','npc_public_bonds','npc_public_bond_queues','tavern_messages','state_cards','territories','relationship_edges','visitor_relationship_projections','owner_configs','visitor_notes','notifications','neighborhood_rumors','neighborhood_knowledge','homes','home_visits','writeback_states','taverns');")"
            REQUIRED_COLUMN_COUNT="$(db_query "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = '${DATABASE_NAME}' AND ((TABLE_NAME = 'story_runs' AND COLUMN_NAME IN ('player_id','story_world_id','content_version')) OR (TABLE_NAME = 'player_story_states' AND COLUMN_NAME IN ('player_id','story_world_id','player_role_id')));")"
            RUN_ROLE_COLUMN_COUNT="$(db_query "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = '${DATABASE_NAME}' AND TABLE_NAME = 'story_runs' AND COLUMN_NAME = 'player_role_id';")"
            INLINE_MEMORY_COLUMN_COUNT_BEFORE="$(db_query "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = '${DATABASE_NAME}' AND TABLE_NAME = 'story_runs' AND COLUMN_NAME = 'private_memories';")"
            DUPLICATE_STATE_KEY_COUNT="$(db_query "SELECT COUNT(*) FROM (SELECT player_id, story_world_id FROM player_story_states GROUP BY player_id, story_world_id HAVING COUNT(*) > 1) AS duplicate_states;")"
            UNBACKFILLABLE_RUN_COUNT="$(db_query "SELECT COUNT(*) FROM story_runs AS story_run LEFT JOIN player_story_states AS player_state ON player_state.player_id = story_run.player_id AND player_state.story_world_id = story_run.story_world_id WHERE player_state.player_id IS NULL OR player_state.player_role_id IS NULL OR CHAR_LENGTH(TRIM(player_state.player_role_id)) = 0 OR CHAR_LENGTH(player_state.player_role_id) > 128;")"
            STORY_RUN_COUNT_BEFORE="$(db_query "SELECT COUNT(*) FROM story_runs;")"
            INVALID_INLINE_MEMORY_COUNT=0
            if [ "${INLINE_MEMORY_COLUMN_COUNT_BEFORE}" = "1" ]; then
              INVALID_INLINE_MEMORY_COUNT="$(db_query "SELECT COUNT(*) FROM story_runs WHERE private_memories IS NOT NULL AND NOT (JSON_TYPE(private_memories) = 'ARRAY' AND JSON_LENGTH(private_memories) = 0);")"
            elif [ "${INLINE_MEMORY_COLUMN_COUNT_BEFORE}" != "0" ]; then
              echo "Preflight blocked: inline private-memory column state is ambiguous"
              exit 1
            fi

            if [ "${SCHEMA_COUNT}" != "1" ]; then
              echo "Preflight blocked: target database is missing"
              exit 1
            fi
            if [ "${REQUIRED_TABLE_COUNT}" != "8" ]; then
              echo "Preflight blocked: current eight-table baseline is incomplete"
              exit 1
            fi
            if [ "${UNREVIEWED_TABLE_COUNT}" != "0" ]; then
              echo "Preflight blocked: database contains a table outside the reviewed 006/008 scope"
              exit 1
            fi
            if [ "${REQUIRED_COLUMN_COUNT}" != "6" ]; then
              echo "Preflight blocked: required 004/006 source columns are incomplete"
              exit 1
            fi
            if [ "${RUN_ROLE_COLUMN_COUNT}" != "0" ]; then
              echo "Preflight blocked: story_runs.player_role_id is not in the expected missing state"
              exit 1
            fi
            if [ "${DUPLICATE_STATE_KEY_COUNT}" != "0" ]; then
              echo "Preflight blocked: player state keys are not unique"
              exit 1
            fi
            if [ "${UNBACKFILLABLE_RUN_COUNT}" != "0" ]; then
              echo "Preflight blocked: one or more StoryRuns cannot be backfilled"
              exit 1
            fi
            if [ "${INVALID_INLINE_MEMORY_COUNT}" != "0" ]; then
              echo "Preflight blocked: inline private memories are not empty"
              exit 1
            fi

            echo "Preflight passed; applying reviewed migration 006"
            DDL_STARTED=true
            sudo docker exec -i "${DB_CONTAINER}" sh -c \
              'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; exec mysql -uroot --database=fablespace --show-warnings' \
              < "${MIGRATION_006}"

            RUN_ROLE_SCHEMA="$(db_query "SELECT CONCAT(LOWER(COLUMN_TYPE), '|', IS_NULLABLE) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = '${DATABASE_NAME}' AND TABLE_NAME = 'story_runs' AND COLUMN_NAME = 'player_role_id';")"
            INVALID_RUN_ROLE_COUNT="$(db_query "SELECT COUNT(*) FROM story_runs WHERE player_role_id IS NULL OR CHAR_LENGTH(TRIM(player_role_id)) = 0;")"
            MISMATCHED_RUN_ROLE_COUNT="$(db_query "SELECT COUNT(*) FROM story_runs AS story_run INNER JOIN player_story_states AS player_state ON player_state.player_id = story_run.player_id AND player_state.story_world_id = story_run.story_world_id WHERE story_run.player_role_id <> player_state.player_role_id;")"
            STORY_RUN_COUNT_AFTER_006="$(db_query "SELECT COUNT(*) FROM story_runs;")"

            if [ "${RUN_ROLE_SCHEMA}" != "varchar(128)|NO" ]; then
              echo "006 verification failed: player_role_id definition is unexpected"
              exit 1
            fi
            if [ "${INVALID_RUN_ROLE_COUNT}" != "0" ] || [ "${MISMATCHED_RUN_ROLE_COUNT}" != "0" ]; then
              echo "006 verification failed: player_role_id data is incomplete"
              exit 1
            fi
            if [ "${STORY_RUN_COUNT_AFTER_006}" != "${STORY_RUN_COUNT_BEFORE}" ]; then
              echo "006 verification failed: StoryRun row count changed"
              exit 1
            fi

            echo "006 verified; applying reviewed migration 008"
            sudo docker exec -i "${DB_CONTAINER}" sh -c \
              'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; exec mysql -uroot --database=fablespace --show-warnings' \
              < "${MIGRATION_008}"

            ACTUAL_TABLES="$(db_query "SELECT TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA = '${DATABASE_NAME}' AND TABLE_TYPE = 'BASE TABLE' ORDER BY TABLE_NAME;")"
            EXPECTED_TABLES="$(printf '%s\n' \
              character_relationships \
              managed_media_assets \
              managed_story_worlds \
              player_story_states \
              private_memories \
              story_events \
              story_messages \
              story_runs)"
            INLINE_MEMORY_COLUMN_COUNT="$(db_query "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = '${DATABASE_NAME}' AND TABLE_NAME = 'story_runs' AND COLUMN_NAME = 'private_memories';")"
            MIGRATION_ROUTINE_COUNT="$(db_query "SELECT COUNT(*) FROM information_schema.ROUTINES WHERE ROUTINE_SCHEMA = '${DATABASE_NAME}' AND ROUTINE_NAME = '_fablespace_migration_008_retire_legacy_space_schema';")"
            STORY_RUN_COUNT_AFTER_008="$(db_query "SELECT COUNT(*) FROM story_runs;")"
            FINAL_RUN_ROLE_SCHEMA="$(db_query "SELECT CONCAT(LOWER(COLUMN_TYPE), '|', IS_NULLABLE) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = '${DATABASE_NAME}' AND TABLE_NAME = 'story_runs' AND COLUMN_NAME = 'player_role_id';")"
            FINAL_INVALID_RUN_ROLE_COUNT="$(db_query "SELECT COUNT(*) FROM story_runs WHERE player_role_id IS NULL OR CHAR_LENGTH(TRIM(player_role_id)) = 0;")"

            if [ "${ACTUAL_TABLES}" != "${EXPECTED_TABLES}" ]; then
              echo "008 verification failed: physical table set is not the eight-table baseline"
              exit 1
            fi
            if [ "${INLINE_MEMORY_COLUMN_COUNT}" != "0" ] || [ "${MIGRATION_ROUTINE_COUNT}" != "0" ]; then
              echo "008 verification failed: retired column or migration routine remains"
              exit 1
            fi
            if [ "${STORY_RUN_COUNT_AFTER_008}" != "${STORY_RUN_COUNT_BEFORE}" ]; then
              echo "008 verification failed: StoryRun row count changed"
              exit 1
            fi
            if [ "${FINAL_RUN_ROLE_SCHEMA}" != "varchar(128)|NO" ] ||
               [ "${FINAL_INVALID_RUN_ROLE_COUNT}" != "0" ]; then
              echo "Final verification failed: player_role_id contract changed after 008"
              exit 1
            fi

            echo "Schema verified; recreating backend from the prepared image"
            compose -f docker-compose.yml -f deploy/docker-compose.shared.yml \
              up -d --no-deps --no-build --force-recreate backend
            BACKEND_READY=false
            for ATTEMPT in $(seq 1 30); do
              if backend_is_healthy; then
                BACKEND_READY=true
                break
              fi
              sleep 2
            done
            if [ "${BACKEND_READY}" != "true" ]; then
              echo "Backend health check failed after schema repair"
              exit 1
            fi

            compose -f docker-compose.yml -f deploy/docker-compose.shared.yml \
              exec -T backend python -c \
              "from sqlalchemy import select; from fablespace_api.infrastructure.database import Database; from fablespace_api.infrastructure.settings import ApiSettings; from fablespace_api.infrastructure.storage import resolve_database_url; from fablespace_api.infrastructure.story_state_models import StoryRunModel; settings = ApiSettings(); database = Database(resolve_database_url(settings), settings.mysql_pool_size, settings.mysql_max_overflow, echo=settings.mysql_echo); session = database.get_session(); session.execute(select(StoryRunModel).limit(1)).first(); session.close(); database.dispose()"

            BACKEND_STOPPED=false
            trap - HUP INT TERM
            trap - EXIT
            echo "StoryRun production schema repair completed"
            echo "Repair started at: ${REPAIR_STARTED_AT}"
            echo "Backup retained at: ${BACKUP_PATH}"
            echo "Backup SHA-256: ${BACKUP_SHA_LINE%% *}"
