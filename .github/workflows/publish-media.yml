name: Publish immutable media

on:
  repository_dispatch:
    types:
      - publish-fablespace-media
      - delete-fablespace-media

permissions:
  contents: read

jobs:
  publish:
    name: Publish reviewed media
    runs-on: ubuntu-latest
    if: vars.DEPLOY_CONFIGURED == 'true' && github.event.action == 'publish-fablespace-media'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CDN_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.CDN_S3_REGION || 'auto' }}
      AWS_EC2_METADATA_DISABLED: "true"
      CDN_BASE_URL: ${{ secrets.CDN_BASE_URL }}
      CDN_S3_BUCKET: ${{ secrets.CDN_S3_BUCKET }}
      CDN_S3_ENDPOINT_URL: ${{ secrets.CDN_S3_ENDPOINT_URL }}
      CDN_S3_PREFIX: ${{ vars.CDN_S3_PREFIX || 'fablespace' }}
      MEDIA_OBJECT_KEY: ${{ github.event.client_payload.object_key }}
      MEDIA_CONTENT_TYPE: ${{ github.event.client_payload.content_type }}
      MEDIA_EXPECTED_BYTES: ${{ github.event.client_payload.bytes }}
      MEDIA_EXPECTED_SHA256: ${{ github.event.client_payload.sha256 }}
      MEDIA_CONTENT_BASE64: ${{ github.event.client_payload.content_base64 }}
      MEDIA_SOURCE_URL: ${{ github.event.client_payload.source_url }}
    steps:
      - name: Validate and publish immutable object
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            CDN_BASE_URL \
            CDN_S3_BUCKET \
            CDN_S3_ENDPOINT_URL \
            MEDIA_OBJECT_KEY \
            MEDIA_EXPECTED_BYTES \
            MEDIA_EXPECTED_SHA256
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required media publication value: ${name}"
              exit 1
            fi
          done

          if [ -n "${MEDIA_CONTENT_BASE64:-}" ] && [ -n "${MEDIA_SOURCE_URL:-}" ]; then
            echo "::error::Use exactly one media source"
            exit 1
          fi
          if [ -z "${MEDIA_CONTENT_BASE64:-}" ] && [ -z "${MEDIA_SOURCE_URL:-}" ]; then
            echo "::error::Missing reviewed media source"
            exit 1
          fi

          case "${CDN_BASE_URL}" in
            https://*) ;;
            *) echo "::error::CDN_BASE_URL must use HTTPS"; exit 1 ;;
          esac
          case "${CDN_S3_ENDPOINT_URL}" in
            https://*) ;;
            *) echo "::error::CDN_S3_ENDPOINT_URL must use HTTPS"; exit 1 ;;
          esac
          case "${MEDIA_OBJECT_KEY}" in
            app/assets/story-worlds/*/player-roles/*/v[0-9]*/avatar.webp) ;;
            app/assets/story-worlds/*/characters/*/v[0-9]*/portrait.webp) ;;
            *) echo "::error::Object key is outside the reviewed story portrait namespaces"; exit 1 ;;
          esac
          case "${MEDIA_OBJECT_KEY}" in
            *..*|/*|*//*)
              echo "::error::Object key is not normalized"
              exit 1
              ;;
          esac
          if [ "${MEDIA_CONTENT_TYPE:-}" != "image/webp" ]; then
            echo "::error::Only reviewed WebP story portraits are accepted"
            exit 1
          fi
          if ! [[ "${MEDIA_EXPECTED_BYTES}" =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "::error::Invalid expected byte count"
            exit 1
          fi
          if ! [[ "${MEDIA_EXPECTED_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid expected SHA-256"
            exit 1
          fi

          CDN_S3_PREFIX="${CDN_S3_PREFIX#/}"
          CDN_S3_PREFIX="${CDN_S3_PREFIX%/}"
          FULL_OBJECT_KEY="${CDN_S3_PREFIX}/media/v1/${MEDIA_OBJECT_KEY}"
          MEDIA_FILE="/tmp/fablespace-media.webp"
          EXISTING_FILE="/tmp/fablespace-existing-media.webp"
          DELIVERED_FILE="/tmp/fablespace-delivered-media.webp"

          if [ -n "${MEDIA_CONTENT_BASE64:-}" ]; then
            printf '%s' "${MEDIA_CONTENT_BASE64}" | base64 --decode > "${MEDIA_FILE}"
          else
            case "${MEDIA_SOURCE_URL}" in
              https://gist.githubusercontent.com/*) ;;
              *) echo "::error::Source URL is outside the approved temporary GitHub host"; exit 1 ;;
            esac
            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --proto '=https' \
              --tlsv1.2 \
              --output "${MEDIA_FILE}" \
              "${MEDIA_SOURCE_URL}"
          fi
          ACTUAL_BYTES="$(wc -c < "${MEDIA_FILE}" | tr -d ' ')"
          ACTUAL_SHA256="$(sha256sum "${MEDIA_FILE}" | cut -d' ' -f1)"
          if [ "${ACTUAL_BYTES}" != "${MEDIA_EXPECTED_BYTES}" ]; then
            echo "::error::Decoded byte count does not match the reviewed value"
            exit 1
          fi
          if [ "${ACTUAL_SHA256}" != "${MEDIA_EXPECTED_SHA256}" ]; then
            echo "::error::Decoded SHA-256 does not match the reviewed value"
            exit 1
          fi

          if aws s3api head-object \
            --bucket "${CDN_S3_BUCKET}" \
            --key "${FULL_OBJECT_KEY}" \
            --endpoint-url "${CDN_S3_ENDPOINT_URL}" >/dev/null 2>&1
          then
            aws s3api get-object \
              --bucket "${CDN_S3_BUCKET}" \
              --key "${FULL_OBJECT_KEY}" \
              --endpoint-url "${CDN_S3_ENDPOINT_URL}" \
              "${EXISTING_FILE}" >/dev/null
            EXISTING_SHA256="$(sha256sum "${EXISTING_FILE}" | cut -d' ' -f1)"
            if [ "${EXISTING_SHA256}" != "${MEDIA_EXPECTED_SHA256}" ]; then
              echo "::error::Immutable object key already exists with different bytes"
              exit 1
            fi
          else
            aws s3api put-object \
              --bucket "${CDN_S3_BUCKET}" \
              --key "${FULL_OBJECT_KEY}" \
              --body "${MEDIA_FILE}" \
              --content-type "${MEDIA_CONTENT_TYPE}" \
              --cache-control "public,max-age=31536000,immutable" \
              --endpoint-url "${CDN_S3_ENDPOINT_URL}" >/dev/null
          fi

          MEDIA_URL="${CDN_BASE_URL%/}/${FULL_OBJECT_KEY}"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            --output "${DELIVERED_FILE}" \
            "${MEDIA_URL}"
          DELIVERED_SHA256="$(sha256sum "${DELIVERED_FILE}" | cut -d' ' -f1)"
          if [ "${DELIVERED_SHA256}" != "${MEDIA_EXPECTED_SHA256}" ]; then
            echo "::error::CDN-delivered bytes do not match the reviewed object"
            exit 1
          fi

          echo "Published ${MEDIA_OBJECT_KEY} (${MEDIA_EXPECTED_BYTES} bytes)"

  delete:
    name: Delete replaced media
    runs-on: ubuntu-latest
    if: vars.DEPLOY_CONFIGURED == 'true' && github.event.action == 'delete-fablespace-media'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CDN_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.CDN_S3_REGION || 'auto' }}
      AWS_EC2_METADATA_DISABLED: "true"
      CDN_BASE_URL: ${{ secrets.CDN_BASE_URL }}
      CDN_S3_BUCKET: ${{ secrets.CDN_S3_BUCKET }}
      CDN_S3_ENDPOINT_URL: ${{ secrets.CDN_S3_ENDPOINT_URL }}
      CDN_S3_PREFIX: ${{ vars.CDN_S3_PREFIX || 'fablespace' }}
      MEDIA_OBJECT_KEY: ${{ github.event.client_payload.object_key }}
      MEDIA_EXPECTED_BYTES: ${{ github.event.client_payload.bytes }}
      MEDIA_EXPECTED_SHA256: ${{ github.event.client_payload.sha256 }}
    steps:
      - name: Validate and delete replaced object
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            CDN_BASE_URL \
            CDN_S3_BUCKET \
            CDN_S3_ENDPOINT_URL \
            MEDIA_OBJECT_KEY \
            MEDIA_EXPECTED_BYTES \
            MEDIA_EXPECTED_SHA256
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required media deletion value: ${name}"
              exit 1
            fi
          done

          case "${MEDIA_OBJECT_KEY}" in
            app/assets/home-story-bookshelf/v1/characters/char_story_palace_eunuch_wei.webp)
              ALLOWED_BYTES="179672"
              ALLOWED_SHA256="eef86ca0a215a1f129413af4585441bf60fecb9e0ba73dd1a733af6b9f099132"
              ;;
            app/assets/home-story-bookshelf/v1/characters/char_story_palace_princess_xiao.webp)
              ALLOWED_BYTES="228834"
              ALLOWED_SHA256="c8a79cf1dcffb540f155c7725c872db0c778be8f8e76969108bb8b6600bd5872"
              ;;
            app/assets/story-worlds/story_palace_snow_edict/player-roles/little-eunuch/v1/avatar.webp)
              ALLOWED_BYTES="71934"
              ALLOWED_SHA256="49d8b8e36775e8ca4e5326a88d92b10bdf2186d4468e0a9a72057a51c674c8e4"
              ;;
            app/assets/story-worlds/story_palace_snow_edict/player-roles/little-palace-maid/v1/avatar.webp)
              ALLOWED_BYTES="81062"
              ALLOWED_SHA256="96006aaeb90785a0b0ccaa898fa34229595b0d19b7bf9d415f84de8800576ea3"
              ;;
            *)
              echo "::error::Object key is outside the one-time replacement deletion whitelist"
              exit 1
              ;;
          esac
          if [ "${MEDIA_EXPECTED_BYTES}" != "${ALLOWED_BYTES}" ]; then
            echo "::error::Deletion byte count does not match the reviewed whitelist"
            exit 1
          fi
          if [ "${MEDIA_EXPECTED_SHA256}" != "${ALLOWED_SHA256}" ]; then
            echo "::error::Deletion SHA-256 does not match the reviewed whitelist"
            exit 1
          fi

          CDN_S3_PREFIX="${CDN_S3_PREFIX#/}"
          CDN_S3_PREFIX="${CDN_S3_PREFIX%/}"
          FULL_OBJECT_KEY="${CDN_S3_PREFIX}/media/v1/${MEDIA_OBJECT_KEY}"
          EXISTING_FILE="/tmp/fablespace-replaced-media.webp"

          aws s3api get-object \
            --bucket "${CDN_S3_BUCKET}" \
            --key "${FULL_OBJECT_KEY}" \
            --endpoint-url "${CDN_S3_ENDPOINT_URL}" \
            "${EXISTING_FILE}" >/dev/null
          ACTUAL_BYTES="$(wc -c < "${EXISTING_FILE}" | tr -d ' ')"
          ACTUAL_SHA256="$(sha256sum "${EXISTING_FILE}" | cut -d' ' -f1)"
          if [ "${ACTUAL_BYTES}" != "${ALLOWED_BYTES}" ] || [ "${ACTUAL_SHA256}" != "${ALLOWED_SHA256}" ]; then
            echo "::error::Remote object bytes do not match the reviewed deletion target"
            exit 1
          fi

          aws s3api delete-object \
            --bucket "${CDN_S3_BUCKET}" \
            --key "${FULL_OBJECT_KEY}" \
            --endpoint-url "${CDN_S3_ENDPOINT_URL}" >/dev/null
          if aws s3api head-object \
            --bucket "${CDN_S3_BUCKET}" \
            --key "${FULL_OBJECT_KEY}" \
            --endpoint-url "${CDN_S3_ENDPOINT_URL}" >/dev/null 2>&1
          then
            echo "::error::Deleted object is still present at the storage origin"
            exit 1
          fi

          MEDIA_URL="${CDN_BASE_URL%/}/${FULL_OBJECT_KEY}"
          CDN_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Cache-Control: no-cache' \
            "${MEDIA_URL}?replacement-delete=${GITHUB_RUN_ID}")"
          if [ "${CDN_STATUS}" != "404" ]; then
            echo "::warning::Origin deletion succeeded but CDN cache-busting verification returned ${CDN_STATUS}"
          fi

          echo "Deleted ${MEDIA_OBJECT_KEY} after exact byte and SHA-256 verification"
