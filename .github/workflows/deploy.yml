name: Deploy Mirror Island

on:
  push:
    branches: [main]
    paths:
      - "apps/mirror-island/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: mirror-island-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FRONTEND_IMAGE: fablespace-frontend:local
  GAME_IMAGE: mirror-island-game:local
  MIGRATION_IMAGE: mirror-island-migrate:local

jobs:
  build:
    name: Build and verify Mirror Island
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_CONFIGURED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Verify game media
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CDN_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.CDN_S3_REGION || 'auto' }}
          AWS_EC2_METADATA_DISABLED: "true"
          CDN_S3_BUCKET: ${{ secrets.CDN_S3_BUCKET }}
          CDN_S3_ENDPOINT_URL: ${{ secrets.CDN_S3_ENDPOINT_URL }}
          MEDIA_BASE_URL: https://img.pingxingxian.space/game/media/v1
        run: |
          set -euo pipefail
          for name in CDN_S3_BUCKET CDN_S3_ENDPOINT_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required game-media setting: ${name}"
              exit 1
            fi
          done
          aws s3api list-objects-v2 \
            --bucket "${CDN_S3_BUCKET}" \
            --prefix "game/media/v1/" \
            --endpoint-url "${CDN_S3_ENDPOINT_URL}" \
            --output json > /tmp/game-media-objects.json
          python deploy/cdn/verify_media_manifest.py \
            --manifest deploy/cdn/game-media-manifest.json \
            --objects /tmp/game-media-objects.json \
            --s3-prefix game/media/v1 \
            --media-base-url "${MEDIA_BASE_URL}" \
            --samples-output /tmp/game-media-samples.txt
          python deploy/cdn/verify_cdn_assets.py \
            --manifest deploy/cdn/game-media-manifest.json

      - name: Build production images
        run: |
          set -euo pipefail
          docker build \
            -f apps/mirror-island/Dockerfile.web \
            --build-arg VITE_KEYCLOAK_URL=https://fable.pingxingxian.space/identity \
            --build-arg VITE_KEYCLOAK_REALM=mirror-island \
            --build-arg VITE_KEYCLOAK_CLIENT_ID=mirror-island-web \
            --build-arg VITE_MIRROR_BASE_PATH=/ \
            -t "${FRONTEND_IMAGE}" .
          docker build -f apps/mirror-island/Dockerfile.server -t "${GAME_IMAGE}" .
          docker build -f apps/mirror-island/Dockerfile.migrate -t "${MIGRATION_IMAGE}" .

      - name: Verify runtime image boundaries
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "${GAME_IMAGE}" -ec \
            '! find /app -type f | grep -E "image-size|@rpgjs/vite|prisma.config"'
          docker run --rm --entrypoint sh "${FRONTEND_IMAGE}" -ec \
            'test -f /usr/share/nginx/html/index.html && test ! -d /usr/share/nginx/html/mirror-island'
          docker run --rm --entrypoint sh "${MIGRATION_IMAGE}" -ec \
            'test "$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1'

      - name: Export image archive
        run: |
          set -euo pipefail
          docker save "${FRONTEND_IMAGE}" "${GAME_IMAGE}" "${MIGRATION_IMAGE}" \
            | gzip -1 > "mirror-island-${GITHUB_SHA}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: mirror-island-${{ github.sha }}
          path: mirror-island-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy, verify, and retire legacy runtime
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mirror-island-${{ github.sha }}
          path: /tmp/mirror-island-deploy

      - name: Upload image archive
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ARCHIVE_PATH: /tmp/mirror-island-deploy/mirror-island-${{ github.sha }}.tar.gz
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required deploy setting: ${name}"
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          scp -P "${DEPLOY_PORT}" -i ~/.ssh/deploy_key \
            "${ARCHIVE_PATH}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/mirror-island-${GITHUB_SHA}.tar.gz"

      - name: Replace production and permanently retire legacy services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -eu
            EXPECTED_SHA="${{ github.sha }}"
            FABLESPACE_PATH="${{ vars.DEPLOY_PATH || '/opt/fablespace' }}"
            test "${{ github.ref }}" = "refs/heads/main"
            cd "${FABLESPACE_PATH}"
            git remote set-url origin "https://github.com/${{ github.repository }}.git"
            git fetch --prune origin main
            git cat-file -e "${EXPECTED_SHA}^{commit}"
            git merge-base --is-ancestor "${EXPECTED_SHA}" origin/main
            git reset --hard "${EXPECTED_SHA}"

            if sudo docker compose version >/dev/null 2>&1; then
              COMPOSE="sudo docker compose"
            else
              COMPOSE="sudo docker-compose"
            fi
            COMPOSE_FILES="-f docker-compose.yml -f deploy/docker-compose.mirror-island.yml"
            CONFIG_OUTPUT="$(sudo python3 deploy/server/configure_mirror_island.py)"
            printf '%s\n' "${CONFIG_OUTPUT}"
            case "${CONFIG_OUTPUT}" in
              *parallellines_changed=true*)
                cd /opt/parallellines
                if sudo docker compose version >/dev/null 2>&1; then
                  PARALLELLINES_COMPOSE="sudo docker compose"
                else
                  PARALLELLINES_COMPOSE="sudo docker-compose"
                fi
                $PARALLELLINES_COMPOSE up -d --no-deps --force-recreate api worker
                PARALLELLINES_READY=false
                for ATTEMPT in $(seq 1 30); do
                  if $PARALLELLINES_COMPOSE exec -T api python -c \
                    "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()" >/dev/null 2>&1; then
                    PARALLELLINES_READY=true
                    break
                  fi
                  sleep 2
                done
                test "${PARALLELLINES_READY}" = "true"
                cd "${FABLESPACE_PATH}"
                ;;
            esac

            IMAGE_ARCHIVE="/tmp/mirror-island-${EXPECTED_SHA}.tar.gz"
            sudo docker load -i "${IMAGE_ARCHIVE}"
            rm -f "${IMAGE_ARCHIVE}"
            $COMPOSE $COMPOSE_FILES pull mirror-identity-db mirror-game-db keycloak
            $COMPOSE $COMPOSE_FILES up -d --no-build mirror-identity-db mirror-game-db

            DATABASES_READY=false
            for ATTEMPT in $(seq 1 30); do
              if $COMPOSE $COMPOSE_FILES exec -T mirror-identity-db sh -ec \
                'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1 \
                && $COMPOSE $COMPOSE_FILES exec -T mirror-game-db sh -ec \
                'pg_isready -U "$MIRROR_GAME_POSTGRES_USER" -d "$MIRROR_GAME_POSTGRES_DB"' >/dev/null 2>&1; then
                DATABASES_READY=true
                break
              fi
              sleep 2
            done
            test "${DATABASES_READY}" = "true"

            BACKUP_ROOT="${FABLESPACE_PATH}/backups"
            sudo install -d -m 0700 \
              "${BACKUP_ROOT}/mirror-island-keycloak" \
              "${BACKUP_ROOT}/mirror-island-game"
            KEYCLOAK_BACKUP="${BACKUP_ROOT}/mirror-island-keycloak/keycloak-${EXPECTED_SHA}.sql.gz"
            GAME_BACKUP="${BACKUP_ROOT}/mirror-island-game/game-${EXPECTED_SHA}.sql.gz"
            if [ ! -f "${KEYCLOAK_BACKUP}" ]; then
              $COMPOSE $COMPOSE_FILES exec -T mirror-identity-db sh -ec \
                'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' \
                | gzip -1 | sudo tee "${KEYCLOAK_BACKUP}" >/dev/null
              sudo test -s "${KEYCLOAK_BACKUP}"
              sudo chmod 0600 "${KEYCLOAK_BACKUP}"
            fi
            if [ ! -f "${GAME_BACKUP}" ]; then
              $COMPOSE $COMPOSE_FILES exec -T mirror-game-db sh -ec \
                'pg_dump -U "$MIRROR_GAME_POSTGRES_USER" "$MIRROR_GAME_POSTGRES_DB"' \
                | gzip -1 | sudo tee "${GAME_BACKUP}" >/dev/null
              sudo test -s "${GAME_BACKUP}"
              sudo chmod 0600 "${GAME_BACKUP}"
            fi

            $COMPOSE $COMPOSE_FILES --profile migration run --rm mirror-game-migrate
            $COMPOSE $COMPOSE_FILES up -d --no-build keycloak mirror-game

            SERVICES_READY=false
            for ATTEMPT in $(seq 1 40); do
              if $COMPOSE $COMPOSE_FILES exec -T mirror-game node -e \
                "Promise.all([fetch('http://127.0.0.1:3001/health'),fetch('http://127.0.0.1:3001/forum-sso/.well-known/openid-configuration'),fetch('http://keycloak:8080/identity/realms/mirror-island/.well-known/openid-configuration')]).then(r=>process.exit(r.every(x=>x.ok)?0:1)).catch(()=>process.exit(1))"; then
                SERVICES_READY=true
                break
              fi
              sleep 3
            done
            test "${SERVICES_READY}" = "true"

            $COMPOSE $COMPOSE_FILES exec -T mirror-game node scripts/probe-forum-oidc.mjs
            $COMPOSE $COMPOSE_FILES exec -T mirror-game node scripts/configure-keycloak-profile.mjs
            $COMPOSE $COMPOSE_FILES up -d --no-deps --no-build --force-recreate frontend

            FRONTEND_READY=false
            for ATTEMPT in $(seq 1 20); do
              if $COMPOSE $COMPOSE_FILES exec -T frontend sh -ec \
                "wget -qO- http://127.0.0.1/ | grep -q '镜像岛' \
                && wget -qO- http://127.0.0.1/identity/realms/mirror-island/.well-known/openid-configuration >/dev/null \
                && wget -qO- --header='Host: fable.pingxingxian.space' http://127.0.0.1/forum-sso/.well-known/openid-configuration \
                  | grep -q 'https://fable.pingxingxian.space/forum-sso/auth'"; then
                FRONTEND_READY=true
                break
              fi
              sleep 2
            done
            test "${FRONTEND_READY}" = "true"
            $COMPOSE $COMPOSE_FILES exec -T frontend sh -ec \
              "wget -S --spider http://127.0.0.1/mirror-island 2>&1 | grep -q '308 Permanent Redirect' \
              && wget -S --spider http://127.0.0.1/mirror-island 2>&1 | grep -q 'Location: /'"

            sudo python3 deploy/server/retire_legacy_fablespace.py
            sudo python3 deploy/server/retire_legacy_fablespace.py --apply
            $COMPOSE $COMPOSE_FILES exec -T frontend wget -qO- http://127.0.0.1/ >/dev/null
            $COMPOSE $COMPOSE_FILES exec -T mirror-game node -e \
              "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            sudo docker image prune -f

      - name: Permanently delete the retired FableSpace object prefix
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CDN_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.CDN_S3_REGION || 'auto' }}
          AWS_EC2_METADATA_DISABLED: "true"
          CDN_S3_BUCKET: ${{ secrets.CDN_S3_BUCKET }}
          CDN_S3_ENDPOINT_URL: ${{ secrets.CDN_S3_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          # Return the actual number of objects under $1 from the provider-neutral Contents array.
          prefix_key_count() {
            local prefix="$1"
            aws s3api list-objects-v2 --bucket "${CDN_S3_BUCKET}" --prefix "${prefix}" --endpoint-url "${CDN_S3_ENDPOINT_URL}" --output json \
              | python -c 'import json, sys; print(len(json.load(sys.stdin).get("Contents") or []))'
          }
          game_before="$(prefix_key_count game/)"
          legacy_before="$(prefix_key_count fablespace/)"
          aws s3 rm "s3://${CDN_S3_BUCKET}/fablespace/" --recursive --endpoint-url "${CDN_S3_ENDPOINT_URL}"
          legacy_after="$(prefix_key_count fablespace/)"
          game_after="$(prefix_key_count game/)"
          echo "legacy_objects_before=${legacy_before} legacy_objects_after=${legacy_after} game_objects_before=${game_before} game_objects_after=${game_after}"
          test "${legacy_after}" = "0"
          test "${game_after}" = "${game_before}"
          echo "retired_objects=${legacy_before} game_objects_preserved=${game_after}"
