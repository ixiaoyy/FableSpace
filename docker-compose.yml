x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  frontend:
    build:
      context: .
      dockerfile: apps/mirror-island/Dockerfile.web
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://fable.pingxingxian.space/identity}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-mirror-island}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-mirror-island-web}
        VITE_MIRROR_BASE_PATH: /
    image: fablespace-frontend:local
    ports:
      - "${FABLESPACE_WEB_BIND:-3000}:80"
    logging: *default-logging
